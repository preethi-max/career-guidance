<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Career Recommendations | CareerCompass</title>
  <meta name="description" content="Personalized career recommendations generated by our multi-factor matching engine based on your skills and goals.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="background-color: var(--slate-100);">
  <header class="app-header"></header>

  <main style="padding: 3rem 0; flex: 1;">
    <div class="container">
      <!-- Page Header -->
      <div style="margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;">
        <div>
          <span class="badge badge-navy">Algorithmic Guidance Engine</span>
          <h1 style="font-size: 2.35rem; margin-top: 0.35rem;">Personalized Career Recommendations</h1>
          <p style="color: var(--slate-500); font-size: 1.05rem; margin-top: 0.25rem;">
            Calculated by scoring your technical skills, branch, interests, and strengths against market career blueprints.
          </p>
        </div>
        <div>
          <a href="/skills-interests.html" class="btn btn-secondary">Update My Skills & Goals</a>
        </div>
      </div>

      <!-- Recommendations Container -->
      <div id="recommendationsList" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div style="text-align: center; padding: 4rem 1rem; color: var(--slate-400);">
          Analyzing your profile and calculating match compatibility scores...
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await API.requireAuth(['STUDENT']);
      if (!user) return;

      loadRecommendations();
    });

    async function loadRecommendations() {
      const container = document.getElementById('recommendationsList');
      try {
        const res = await API.get('/api/careers/recommendations');
        if (res.success && res.data) {
          const recs = res.data;

          if (recs.length === 0) {
            container.innerHTML = `
              <div class="card" style="text-align: center; padding: 4rem 2rem;">
                <h3>No recommendations generated</h3>
                <p style="color: var(--slate-500); margin-top: 0.5rem;">Please enter your skills and interests to generate personalized scores.</p>
                <a href="/skills-interests.html" class="btn btn-primary" style="margin-top: 1.5rem;">Fill Profile Skills</a>
              </div>
            `;
            return;
          }

          container.innerHTML = recs.map((r, index) => {
            const matchColor = r.matchPercentage >= 80 ? 'var(--emerald-500)' : (r.matchPercentage >= 60 ? 'var(--blue-600)' : 'var(--amber-500)');
            const matchBadgeClass = r.matchPercentage >= 80 ? 'badge-success' : (r.matchPercentage >= 60 ? 'badge-blue' : 'badge-warning');

            const matchedSkillsHtml = (r.matchedSkills && r.matchedSkills.length > 0)
              ? r.matchedSkills.map(s => `<span class="badge badge-success" style="font-size:0.75rem;">✓ ${s}</span>`).join(' ')
              : `<span style="font-size: 0.85rem; color: var(--slate-400);">None matched yet</span>`;

            const missingSkillsHtml = (r.missingSkills && r.missingSkills.length > 0)
              ? r.missingSkills.map(s => `<span class="badge badge-warning" style="font-size:0.75rem;">+ ${s}</span>`).join(' ')
              : `<span style="font-size: 0.85rem; color: var(--slate-400);">All core skills present!</span>`;

            const matchedInterestsHtml = (r.matchedInterests && r.matchedInterests.length > 0)
              ? r.matchedInterests.map(i => `<span class="badge badge-blue" style="font-size:0.75rem;">★ ${i}</span>`).join(' ')
              : `<span style="font-size: 0.85rem; color: var(--slate-400);">None</span>`;

            return `
              <div class="card" style="padding: 2rem; position: relative; border-left: 6px solid ${matchColor};">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem;">
                  <div>
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem;">
                      <span class="badge ${matchBadgeClass}" style="font-size: 0.85rem; font-weight: 800;">
                        ${r.matchPercentage}% MATCH
                      </span>
                      <span class="badge badge-navy">${r.career.category}</span>
                      ${index === 0 ? '<span class="badge badge-blue" style="background:#e0f2fe; color:#0284c7;">🌟 Top Pick For You</span>' : ''}
                    </div>
                    <h2 style="font-size: 1.6rem; margin-bottom: 0.35rem;">${r.career.title}</h2>
                    <p style="color: var(--slate-600); font-size: 0.95rem; max-width: 820px; line-height: 1.55;">
                      ${r.career.description}
                    </p>
                  </div>

                  <div style="text-align: right; background-color: var(--slate-50); padding: 0.85rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--slate-200);">
                    <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--slate-500); font-weight: 700;">Market Compensation</div>
                    <div style="font-size: 1.15rem; font-weight: 800; color: var(--navy-900);">${r.career.salaryRange || 'Competitive'}</div>
                    <div style="font-size: 0.78rem; color: var(--emerald-500); font-weight: 600;">Outlook: ${r.career.jobOutlook || 'High Demand'}</div>
                  </div>
                </div>

                <!-- Explanation Breakdown Box -->
                <div style="background-color: #f8fafc; border: 1px solid var(--slate-200); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.5rem;">
                  <h4 style="font-size: 0.95rem; margin-bottom: 0.6rem; color: var(--navy-900); display: flex; align-items: center; gap: 0.4rem;">
                    <span>💡</span> Why this path is recommended:
                  </h4>
                  <p style="font-size: 0.92rem; color: var(--navy-800); margin-bottom: 1rem; line-height: 1.5;">
                    ${r.recommendationReason || 'Your profile exhibits foundational compatibility with this domain.'}
                  </p>

                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; font-size: 0.85rem;">
                    <div>
                      <strong style="color: var(--slate-600); display: block; margin-bottom: 0.35rem;">Matched Technical Skills:</strong>
                      <div style="display: flex; flex-wrap: wrap; gap: 0.35rem;">${matchedSkillsHtml}</div>
                    </div>
                    <div>
                      <strong style="color: var(--slate-600); display: block; margin-bottom: 0.35rem;">Recommended Skills to Learn:</strong>
                      <div style="display: flex; flex-wrap: wrap; gap: 0.35rem;">${missingSkillsHtml}</div>
                    </div>
                    <div>
                      <strong style="color: var(--slate-600); display: block; margin-bottom: 0.35rem;">Aligned Interests & Goals:</strong>
                      <div style="display: flex; flex-wrap: wrap; gap: 0.35rem;">${matchedInterestsHtml}</div>
                    </div>
                    <div>
                      <strong style="color: var(--slate-600); display: block; margin-bottom: 0.35rem;">Education Alignment:</strong>
                      <span style="color: var(--navy-900); font-weight: 600;">${r.educationFit || 'Eligible'}</span>
                    </div>
                  </div>
                </div>

                <!-- Action Footer -->
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                  <div style="font-size: 0.85rem; color: var(--slate-500);">
                    Sample Roles: <span style="color: var(--navy-800); font-weight: 500;">${r.career.sampleRoles || 'Entry to Senior'}</span>
                  </div>
                  <div style="display: flex; gap: 0.75rem;">
                    <a href="/career-details.html?id=${r.career.id}" class="btn btn-sm btn-secondary">Detailed Career Specs</a>
                    <a href="/roadmap.html?careerId=${r.career.id}" class="btn btn-sm btn-accent">Start Learning Roadmap &rarr;</a>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        container.innerHTML = `<div style="color: var(--rose-500); padding: 2rem;">Error calculating recommendations: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
