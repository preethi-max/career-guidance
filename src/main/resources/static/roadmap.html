<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Career Roadmap | CareerCompass</title>
  <meta name="description" content="Step-by-step milestone learning roadmap with real progress tracking in MySQL.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="background-color: var(--slate-100);">
  <header class="app-header"></header>

  <main style="padding: 3rem 0; flex: 1;">
    <div class="container container-narrow">
      <!-- Roadmap Header & Switcher -->
      <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem;">
          <div>
            <span class="badge badge-navy">Milestone Roadmap</span>
            <h1 style="font-size: 2rem; margin-top: 0.35rem;" id="roadmapTitle">Career Roadmap</h1>
            <p style="color: var(--slate-500); font-size: 0.95rem; margin-top: 0.25rem;" id="roadmapDesc">
              Track your learning journey step-by-step.
            </p>
          </div>

          <!-- Quick Career Switcher -->
          <div style="min-width: 240px;">
            <label class="form-label" for="careerSelect" style="font-size: 0.8rem;">Switch Career Roadmap:</label>
            <select id="careerSelect" class="form-control" onchange="switchRoadmap(this.value)">
              <option value="1">Full Stack Software Engineer</option>
              <option value="2">Data Scientist & AI Specialist</option>
              <option value="3">Cloud Solutions Architect</option>
              <option value="4">Cybersecurity Analyst</option>
              <option value="5">UI/UX Product Designer</option>
              <option value="6">Product / Business Manager</option>
              <option value="7">DevOps & Site Reliability Engineer</option>
              <option value="8">AI & NLP Engineer</option>
              <option value="9">Financial Analyst & FinTech</option>
              <option value="10">Computer Science Educator</option>
            </select>
          </div>
        </div>

        <!-- Progress Bar Summary -->
        <div style="background-color: var(--slate-50); border: 1px solid var(--slate-200); border-radius: var(--radius-md); padding: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span style="font-weight: 700; font-size: 0.95rem; color: var(--navy-900);">Your Actual Progress:</span>
            <span style="font-weight: 800; font-size: 1.1rem; color: var(--blue-600);" id="progressPercentText">0% Complete</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
          </div>
          <div style="font-size: 0.82rem; color: var(--slate-500); margin-top: 0.4rem;" id="progressCountText">
            0 of 0 steps completed
          </div>
        </div>
      </div>

      <!-- Steps Timeline Container -->
      <div id="roadmapTimeline" class="roadmap-timeline">
        <div style="text-align: center; padding: 2rem; color: var(--slate-400);">Loading learning milestones...</div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let currentCareerId = '1';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentCareerId = urlParams.get('careerId') || '1';
      document.getElementById('careerSelect').value = currentCareerId;

      loadRoadmap(currentCareerId);
    });

    function switchRoadmap(careerId) {
      currentCareerId = careerId;
      window.history.replaceState(null, '', `/roadmap.html?careerId=${careerId}`);
      loadRoadmap(careerId);
    }

    async function loadRoadmap(careerId) {
      const timeline = document.getElementById('roadmapTimeline');
      try {
        const res = await API.get(`/api/roadmaps/career/${careerId}`);
        if (res.success && res.data) {
          const rm = res.data;
          document.getElementById('roadmapTitle').innerText = rm.careerTitle || rm.title;
          document.getElementById('roadmapDesc').innerText = rm.description || 'Estimated Timeline: ' + (rm.estimatedMonths || '6 Months');

          updateProgressUi(rm.completedSteps, rm.totalSteps, rm.progressPercentage);

          if (!rm.steps || rm.steps.length === 0) {
            timeline.innerHTML = `<div style="padding: 2rem; background: var(--white); border-radius: var(--radius-md);">No steps found for this roadmap.</div>`;
            return;
          }

          timeline.innerHTML = rm.steps.map(step => `
            <div class="timeline-step ${step.completed ? 'completed' : ''}" id="step-card-${step.stepId}">
              <div class="timeline-step-marker">
                ${step.completed ? '✓' : step.stepNumber}
              </div>

              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem;">
                <div>
                  <span class="badge ${step.completed ? 'badge-success' : 'badge-navy'}" style="font-size: 0.72rem; margin-bottom: 0.35rem;">
                    Stage ${step.stepNumber} ${step.estimatedWeeks ? '• ' + step.estimatedWeeks : ''}
                  </span>
                  <h3 style="font-size: 1.25rem;">${step.title}</h3>
                </div>

                <!-- Checkbox Toggle -->
                <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; font-weight: 600; cursor: pointer; background: var(--slate-100); padding: 0.45rem 0.85rem; border-radius: var(--radius-md);">
                  <input type="checkbox" ${step.completed ? 'checked' : ''} onchange="toggleStep(${step.stepId}, this.checked)" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--emerald-500);">
                  <span>${step.completed ? 'Completed' : 'Mark Complete'}</span>
                </label>
              </div>

              <p style="color: var(--slate-600); font-size: 0.92rem; line-height: 1.5; margin-bottom: 1rem;">
                ${step.description}
              </p>

              ${step.keyTopics ? `
                <div style="background-color: var(--slate-50); border: 1px solid var(--slate-200); border-radius: var(--radius-md); padding: 0.75rem 1rem; margin-bottom: 0.75rem; font-size: 0.85rem;">
                  <strong style="color: var(--navy-900);">Key Topics:</strong> <span style="color: var(--slate-600);">${step.keyTopics}</span>
                </div>
              ` : ''}

              ${step.learningResourcesText ? `
                <div style="font-size: 0.82rem; color: var(--slate-500);">
                  <strong>Recommended Resources:</strong> <span>${step.learningResourcesText}</span>
                </div>
              ` : ''}
            </div>
          `).join('');
        }
      } catch (err) {
        timeline.innerHTML = `<div style="color: var(--rose-500); padding: 2rem;">Failed to load roadmap: ${err.message}</div>`;
      }
    }

    async function toggleStep(stepId, completed) {
      try {
        const res = await API.post(`/api/roadmaps/steps/${stepId}/toggle`, { completed });
        if (res.success && res.data) {
          const rm = res.data;
          updateProgressUi(rm.completedSteps, rm.totalSteps, rm.progressPercentage);

          const card = document.getElementById(`step-card-${stepId}`);
          if (card) {
            const marker = card.querySelector('.timeline-step-marker');
            const labelSpan = card.querySelector('label span');
            if (completed) {
              card.classList.add('completed');
              marker.innerText = '✓';
              labelSpan.innerText = 'Completed';
              API.showToast("Milestone marked completed! Progress saved in database.", "success");
            } else {
              card.classList.remove('completed');
              marker.innerText = card.querySelector('.badge').innerText.split(' ')[1];
              labelSpan.innerText = 'Mark Complete';
              API.showToast("Milestone progress updated.", "info");
            }
          }
        }
      } catch (err) {
        API.showToast(err.message || "Failed to update step", "error");
      }
    }

    function updateProgressUi(completed, total, percentage) {
      document.getElementById('progressPercentText').innerText = `${percentage}% Complete`;
      document.getElementById('progressBarFill').style.width = `${percentage}%`;
      document.getElementById('progressCountText').innerText = `${completed} of ${total} milestones completed`;
    }
  </script>
</body>
</html>
