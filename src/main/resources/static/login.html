<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | CareerCompass</title>
  <meta name="description" content="Log in to your CareerCompass student, mentor, or administrator account.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="background-color: var(--slate-100);">
  <header class="app-header"></header>

  <main style="display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; flex: 1;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 2.5rem; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-navy">Secure Portal</span>
        <h1 style="font-size: 1.85rem; margin-top: 0.5rem;">Welcome Back</h1>
        <p style="color: var(--slate-500); font-size: 0.95rem; margin-top: 0.25rem;">Sign in to continue to your dashboard</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="password">Password</label>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
          Log In
        </button>
      </form>

      <!-- Quick Demo Login Helpers for Testing -->
      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed var(--slate-200);">
        <p style="font-size: 0.8rem; font-weight: 700; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; text-align: center;">
          ⚡ Quick Demo Accounts (1-Click Fill)
        </p>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemo('student@careerguidance.com', 'Student@123')">
            🎓 Demo Student (Aarav Sharma)
          </button>
          <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemo('priya.sharma@careerguidance.com', 'Guide@123')">
            💼 Demo Guide (Dr. Priya Sharma - AI)
          </button>
          <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemo('admin@careerguidance.com', 'Admin@123')">
            🛡️ Platform Administrator
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--slate-500);">
        Don't have an account yet? <a href="/register.html" style="font-weight: 600;">Create an account</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      API.showToast(`Filled credentials for ${email}`, 'info');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.innerText = 'Verifying credentials...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await API.post('/api/auth/login', { email, password });
        if (res.success && res.data) {
          const user = res.data;
          API.showToast("Login successful! Redirecting...", "success");

          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');

          setTimeout(() => {
            if (redirect && !redirect.includes('login') && !redirect.includes('register')) {
              window.location.href = redirect;
            } else if (user.role === 'ADMIN') {
              window.location.href = '/admin-dashboard.html';
            } else if (user.role === 'CAREER_GUIDE') {
              window.location.href = '/guide-dashboard.html';
            } else {
              window.location.href = '/dashboard.html';
            }
          }, 600);
        } else {
          API.showToast(res.message || "Invalid credentials", "error");
          loginBtn.disabled = false;
          loginBtn.innerText = 'Log In';
        }
      } catch (err) {
        API.showToast(err.message || "Invalid email or password", "error");
        loginBtn.disabled = false;
        loginBtn.innerText = 'Log In';
      }
    }
  </script>
</body>
</html>
