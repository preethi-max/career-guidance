# Spring Boot Configuration for Student Career Guidance App
spring.application.name=career-guidance-app

# Server Port
server.port=${SERVER_PORT:8080}

# MySQL Datasource Configuration (reads from environment variables or defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/career_guidance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Session Configuration
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=CAREER_SESSION_ID

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.com.careerguidance=INFO
logging.level.org.springframework.security=WARN
